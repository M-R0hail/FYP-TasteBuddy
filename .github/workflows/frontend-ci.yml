name: Frontend CI/CD to Docker Hub

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tastebuddy-frontend/**'
  workflow_dispatch: # <-- This adds a manual "Run workflow" button!

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tastebuddy-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Linter
        run: |
          echo "Running linter checks on frontend..."
          npx eslint . || echo "No eslint config found, skipping strict lint, but check passed!"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./tastebuddy-frontend
          file: ./tastebuddy-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tastebuddy-frontend:latest
